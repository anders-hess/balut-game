name: Oracle 3.0 fresh rational action-Q corpus
on:
  push:
    branches:
      - 'research/oracle-3.0-phase7-fresh-rational-action-q-corpus-*'
    paths:
      - 'research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs'
      - '.github/workflows/oracle3-fresh-rational-action-q-corpus.yml'
  workflow_dispatch:
concurrency:
  group: oracle3-fresh-action-q-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-math-independent-splits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce independent mathematical architecture
        run: |
          set -o pipefail
          node research/oracle-3.0/pure/guard.mjs | tee oracle3-action-q-guard.log
      - name: Generate fresh train validation and locked-test action-Q BigInt labels
        run: |
          set -o pipefail
          node research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs | tee oracle3-action-q-corpus.log
      - name: Verify split independence and exact Q maxima
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const seeds=new Set();
          for(const split of ['train','validation','locked_test']){
            const data=JSON.parse(readFileSync('oracle3-action-q-'+split+'.json'));
            assert.equal(data.split,split);
            for(const card of data.cards){
              assert.ok(!seeds.has(card.seed));seeds.add(card.seed);
              assert.equal(card.witness.length,26);
              assert.equal(card.roots.length,2);
              for(const root of card.roots){
                const values=Object.values(root.actionQNumerators).map(BigInt);
                assert.equal(values.reduce((a,b)=>a>b?a:b).toString(),root.bestNumerator);
                assert.ok(BigInt(root.denominator)>0n);
              }
            }
          }
          assert.equal(seeds.size,30);
          NODE
      - name: Archive exact labels and runtime metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-fresh-rational-action-q-corpus
          path: |
            oracle3-action-q-*.json
            oracle3-action-q-*.log
          if-no-files-found: ignore
