name: Oracle 3.0 independent score-action Q audit
on:
  push:
    branches:
      - 'research/oracle-3.0-phase7-independent-score-q-audit-*'
  workflow_dispatch:
concurrency:
  group: oracle3-score-q-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-score-q:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard independent mathematical architecture
        run: node research/oracle-3.0/pure/guard.mjs
      - name: Generate fresh exact rational corpus
        run: node research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs
      - name: Verify legal witnesses and action completeness
        run: |
          node research/oracle-3.0/pure/fresh-action-q-integrity.mjs
          node research/oracle-3.0/pure/fresh-action-q-action-space-audit.mjs
      - name: Independently recompute score-action Q on train and validation
        run: node research/oracle-3.0/pure/independent-score-action-q-audit.mjs
      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-iteration30-independent-score-q
          path: oracle3-*.json
          if-no-files-found: ignore
