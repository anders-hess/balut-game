name: Oracle 3.0 action-Q exhaustive action-space audit
on:
  push:
    branches:
      - 'research/oracle-3.0-phase7-action-space-audit-*'
    paths:
      - 'research/oracle-3.0/pure/fresh-action-q-action-space-audit.mjs'
      - '.github/workflows/oracle3-action-space-audit.yml'
      - 'research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs'
  workflow_dispatch:
concurrency:
  group: oracle3-action-space-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-action-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce independent mathematical architecture
        run: node research/oracle-3.0/pure/guard.mjs
      - name: Generate exact rational training validation and locked-test corpus
        run: node research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs
      - name: Replay scorecard witnesses and verify rational integrity
        run: node research/oracle-3.0/pure/fresh-action-q-integrity.mjs
      - name: Independently enumerate every legal action and compare all Q keys
        run: node research/oracle-3.0/pure/fresh-action-q-action-space-audit.mjs
      - name: Archive data and audits even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-iteration26-action-space-audit
          path: oracle3-action-q-*.json
          if-no-files-found: ignore
