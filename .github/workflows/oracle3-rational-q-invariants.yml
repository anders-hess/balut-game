name: Oracle 3.0 exact rational Q invariants
on:
  push:
    branches:
      - 'research/oracle-3.0-phase7-rational-q-invariants-*'
  workflow_dispatch:
concurrency:
  group: oracle3-rational-invariants-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rational-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture guard
        run: node research/oracle-3.0/pure/guard.mjs
      - name: Generate independent exact rational action-Q corpus
        run: node research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs
      - name: Verify corpus and legal action space
        run: |
          node research/oracle-3.0/pure/fresh-action-q-integrity.mjs
          node research/oracle-3.0/pure/fresh-action-q-action-space-audit.mjs
      - name: Audit exact rational Q arithmetic and score identities
        run: node research/oracle-3.0/pure/rational-q-invariants.mjs
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-iteration33-rational-q-invariants
          path: oracle3-*.json
          if-no-files-found: ignore
