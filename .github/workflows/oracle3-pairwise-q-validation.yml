name: Oracle 3.0 independent exact-Q pairwise ranking validation
on:
  push:
    branches:
      - 'research/oracle-3.0-phase7-pairwise-q-ranking-*'
  workflow_dispatch:
concurrency:
  group: oracle3-pairwise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-q-pairwise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce independent mathematical architecture
        run: node research/oracle-3.0/pure/guard.mjs
      - name: Generate exact rational train validation and untouched locked test
        run: node research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs
      - name: Audit scorecard witnesses and data splits
        run: node research/oracle-3.0/pure/fresh-action-q-integrity.mjs
      - name: Audit complete legal action set
        run: node research/oracle-3.0/pure/fresh-action-q-action-space-audit.mjs
      - name: Fit original mathematical linear action Q student
        run: node research/oracle-3.0/pure/direct-action-q-student.mjs
      - name: Fit pairwise exact Q ranking student and compare on validation only
        run: node research/oracle-3.0/pure/pairwise-action-q-ranking.mjs
      - name: Archive labels and ablation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-iteration28-pairwise-q-validation
          path: oracle3-*.json
          if-no-files-found: ignore
