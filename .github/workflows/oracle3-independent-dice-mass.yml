name: Oracle 3.0 independent dice mass audit
on:
  push:
    branches:
      - 'research/oracle-3.0-phase8-independent-dice-mass-*'
  workflow_dispatch:
jobs:
  dice-mass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent fair-dice mass and Q numerator tests
        run: node research/oracle-3.0/pure/independent-dice-mass-audit.mjs
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-iteration34-dice-mass
          path: oracle3-iteration34-dice-mass.json
          if-no-files-found: ignore
