name: Oracle 3.0 paired validation uncertainty audit
on:
  push:
    branches:
      - 'research/oracle-3.0-phase7-paired-validation-uncertainty-*'
  workflow_dispatch:
concurrency:
  group: oracle3-paired-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard independent architecture
        run: node research/oracle-3.0/pure/guard.mjs
      - name: Generate exact rational corpus
        run: node research/oracle-3.0/pure/fresh-rational-action-q-corpus.mjs
      - name: Verify corpus and action completeness
        run: |
          node research/oracle-3.0/pure/fresh-action-q-integrity.mjs
          node research/oracle-3.0/pure/fresh-action-q-action-space-audit.mjs
      - name: Fit training-only mathematical students
        run: |
          node research/oracle-3.0/pure/direct-action-q-student.mjs
          node research/oracle-3.0/pure/pairwise-action-q-ranking.mjs
      - name: Enumerate exact paired cluster bootstrap on validation only
        run: node research/oracle-3.0/pure/paired-validation-uncertainty.mjs
      - name: Archive complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-iteration29-paired-validation
          path: oracle3-*.json
          if-no-files-found: ignore
