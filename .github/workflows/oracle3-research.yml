name: Oracle 3.0 research parity and baseline
on:
  push:
    branches:
      - 'research/oracle-3.0-*'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 1 simulator tests
        run: node research/oracle-3.0/phase1/test.mjs
      - name: Production scoring parity and small baseline
        run: |
          set -o pipefail
          node research/oracle-3.0/phase1/production-baseline.mjs 3 20261104 | tee oracle3-phase1-baseline.json
      - name: Archive baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-phase1-baseline
          path: oracle3-phase1-baseline.json
          if-no-files-found: ignore

      - name: Cached BPIV parity and speed benchmark
        run: |
          set -o pipefail
          node research/oracle-3.0/phase1/test-cache.mjs | tee oracle3-cache-benchmark.json
      - name: Archive cache benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-cache-benchmark
          path: oracle3-cache-benchmark.json
          if-no-files-found: ignore

      - name: Phase 2 deterministic trajectory tests
        run: node research/oracle-3.0/phase2/test.mjs
      - name: Collect phase 2 Oracle trajectories
        run: |
          set -o pipefail
          node research/oracle-3.0/phase2/collect.mjs 120 100000000 oracle3-trajectories | tee oracle3-collection-output.json
      - name: Validate collected phase 2 data
        run: node research/oracle-3.0/phase2/validate-dataset.mjs oracle3-trajectories
      - name: Archive phase 2 training data and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-phase2-trajectories
          path: |
            oracle3-trajectories.jsonl
            oracle3-trajectories.metrics.json
            oracle3-collection-output.json
          if-no-files-found: ignore

      - name: Train and evaluate neural value model on whole-game holdout
        run: |
          set -o pipefail
          node research/oracle-3.0/phase2/train.mjs oracle3-trajectories oracle3-neural | tee oracle3-neural-output.json
      - name: Archive neural holdout metrics and weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-neural-holdout
          path: |
            oracle3-neural.metrics.json
            oracle3-neural.weights.json
            oracle3-neural-output.json
          if-no-files-found: ignore

      - name: Paired game-level value gate vs turn-conditioned baseline
        run: |
          set -o pipefail
          node research/oracle-3.0/phase2/evaluate-paired.mjs oracle3-trajectories oracle3-neural | tee oracle3-paired-output.json
      - name: Archive paired value gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle3-paired-value-gate
          path: |
            oracle3-neural.paired.json
            oracle3-paired-output.json
          if-no-files-found: ignore
